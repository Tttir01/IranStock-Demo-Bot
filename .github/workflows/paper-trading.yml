name: Iran Stock Paper Trading
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
jobs:
  paper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Market data, paper signal and dashboard
        run: python -m src.main
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: iran-stock-dashboard
          path: dashboard/
          retention-days: 7
