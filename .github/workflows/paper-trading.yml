name: Iran Stock Paper Trading
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
jobs:
  paper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Market data and paper signal
        run: python -m src.main
