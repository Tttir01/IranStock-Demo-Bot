name: Iran Stock Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: iran-stock-paper-trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run paper trading and dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: "true"
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
          BRS_API_TIMEOUT: "10"
          TINDEX_API_KEY: ${{ secrets.TINDEX_API_KEY }}
          TINDEX_API_TIMEOUT: "12"
        run: python -m src.main

      - name: Commit paper state
        run: |
          git config user.name "IranStock Demo Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data dashboard
          if git diff --cached --quiet; then
            echo "No state/dashboard changes to commit."
            exit 0
          fi
          git commit -m "Update paper trading state"
          git push origin HEAD:main

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: iran-stock-dashboard
          path: dashboard/
          retention-days: 7
