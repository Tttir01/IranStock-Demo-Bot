<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iran Stock Demo — داشبورد</title>
<style>
:root{--bg:#0b1220;--card:#121c2e;--line:#263650;--txt:#e8eef8;--muted:#91a0b8;--up:#42d392;--down:#ff7185;--warn:#f5b942}
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;margin:0;background:var(--bg);color:var(--txt)}
.wrap{max-width:1150px;margin:auto;padding:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:22px}
h3{margin:0 0 10px;font-size:15px;color:var(--txt)}
.badge{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--up);border-color:#1f5c40}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-top:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 20px #0003}
.muted{color:var(--muted);font-size:12px}
.big{font-size:21px;font-weight:700;margin-top:4px;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:400;font-size:12px}
tr.row{cursor:pointer}
tr.row:hover{background:#17233a}
tr.dead{opacity:.55}
.bar{display:inline-block;width:58px;height:6px;border-radius:4px;background:#22304a;vertical-align:middle;overflow:hidden;margin-left:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f6df6,#42d392)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.buy{color:var(--up);border-color:#1f5c40}
.pill.watch{color:var(--warn);border-color:#5b4a1c}
.pill.none{color:var(--muted)}
.pill.bad{color:var(--down);border-color:#5c2029}
.scroll{overflow:auto}
#detail{display:none;margin-top:12px;border-color:#2f4668}
#detail ul{margin:6px 0 0;padding-inline-start:18px;font-size:13px;line-height:1.9}
footer{margin:22px 0 8px;color:var(--muted);font-size:12px;line-height:1.9}
@media(max-width:600px){.wrap{padding:10px}.big{font-size:17px}h1{font-size:18px}}
</style>
</head>
<body><div class="wrap">
<div class="head">
  <h1>📊 Iran Stock Demo — گزارش Paper Trading</h1>
  <div>
    <span class="badge ok" id="mode">حالت: —</span>
    <span class="badge" id="updated">در حال دریافت داده…</span>
  </div>
</div>

<div id="summary" class="grid"></div>

<div class="card" style="margin-top:14px">
  <h3>🏆 خروجی اسکن نمادها</h3>
  <div class="muted" id="scanNote"></div>
  <div class="scroll"><div id="scan"></div></div>
</div>

<div id="detail" class="card"></div>

<div class="two">
  <div class="card"><h3>💰 حساب Paper</h3><div id="positions"></div></div>
  <div class="card"><h3>⚙️ عملیات این اجرا</h3><div id="actions"></div></div>
</div>

<div class="two">
  <div class="card"><h3>🔥 برترین رشد</h3><div id="gainers"></div></div>
  <div class="card"><h3>💧 بیشترین حجم</h3><div id="volume"></div></div>
</div>

<footer>
  این سامانه فقط Paper/Demo و DRY_RUN است؛ هیچ سفارش واقعی به کارگزاری ارسال نمی‌شود.
  خروجی‌های تحلیلی توصیه سرمایه‌گذاری نیستند. واحد قیمت: تومان.
</footer>
</div>
<script>
const money=n=>Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:0});
const pct=n=>Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:2})+'٪';
const num=n=>(n===null||n===undefined||n==='')?'—':Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
const esc=s=>String(s===null||s===undefined?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actionPill=a=>{const v=String(a||'').toUpperCase();
  const cls=v==='BUY'?'buy':v==='WATCH'?'watch':(v==='UNAVAILABLE'||v==='NO_DATA')?'bad':'none';
  return '<span class="pill '+cls+'">'+esc(v||'—')+'</span>';};

function marketTable(rows,note){
  if(!rows||!rows.length){return '<div class="muted">'+(note||'داده‌ای در دسترس نبود.')+'</div>';}
  return '<table><tr><th>نماد</th><th>تغییر</th><th>آخرین (تومان)</th><th>حجم</th></tr>'+
    rows.map(x=>'<tr><td>'+esc(x.symbol)+'</td><td class="'+(Number(x.change_pct)>=0?'up':'down')+'">'+pct(x.change_pct)+
    '</td><td>'+money(x.last_toman)+'</td><td>'+money(x.volume)+'</td></tr>').join('')+'</table>';
}

function actionTable(actions){
  if(!actions||!actions.length){return '<div class="muted">عملیاتی ثبت نشد.</div>';}
  return '<table><tr><th>نماد</th><th>عملیات</th><th>دلیل</th></tr>'+
    actions.map(a=>'<tr><td>'+esc(a.symbol)+'</td><td>'+actionPill(a.action)+'</td><td class="muted">'+esc(a.reason)+'</td></tr>').join('')+'</table>';
}

function positionTable(paper){
  const p=(paper&&paper.positions)||{};
  const keys=Object.keys(p);
  if(!keys.length){return '<div class="muted">موقعیت بازی وجود ندارد.</div>';}
  return '<table><tr><th>نماد</th><th>تعداد</th><th>ورود</th><th>ارزش روز</th><th>حد ضرر</th><th>حد سود</th></tr>'+
    keys.map(k=>{const x=p[k]||{};return '<tr><td>'+esc(k)+'</td><td>'+money(x.quantity)+'</td><td>'+money(x.entry)+
    '</td><td>'+money(x.market_value)+'</td><td class="down">'+money(x.stop_loss)+'</td><td class="up">'+money(x.take_profit)+'</td></tr>';}).join('')+'</table>';
}

function render(d){
  const s=d.summary||{}, paper=d.paper||{}, results=d.scan_results||[], actions=d.actions||[];
  // Older data.json files predate the summary counters, so derive fallbacks.
  const avail=s.available??results.filter(r=>Number(r.price)>0).length;
  const topScore=s.top_score??Math.max(0,...results.map(r=>Number(r.signal?.score||0)));
  const min=s.min_score??'—';
  document.getElementById('mode').textContent='حالت: '+(s.mode||'DRY_RUN')+' | آستانه خرید: '+min+'/100';
  document.getElementById('updated').textContent=d.generated_at?('آخرین بروزرسانی: '+new Date(d.generated_at).toLocaleString('fa-IR')):'زمان نامشخص';

  document.getElementById('summary').innerHTML=[
    ['ارزش پرتفوی', money(paper.equity)+' تومان',''],
    ['نقدینگی', money(paper.cash)+' تومان',''],
    ['سود/زیان محقق‌شده', money(paper.realized_pnl)+' تومان', Number(paper.realized_pnl)>=0?'up':'down'],
    ['حداکثر افت سرمایه', pct(paper.max_drawdown_pct), Number(paper.max_drawdown_pct)>0?'warn':''],
    ['موقعیت باز', num(paper.open_positions)+' / معاملات: '+num(paper.trades),''],
    ['نمادهای اسکن‌شده', num(avail)+' معتبر از '+num(s.scanned??results.length)+' | بالاترین امتیاز: '+num(topScore),'']
  ].map(([t,v,c])=>'<div class="card"><div class="muted">'+t+'</div><div class="big '+c+'">'+v+'</div></div>').join('');

  document.getElementById('scanNote').textContent = results.length
    ? (avail===0 ? 'هیچ نمادی در این اجرا داده معتبر نداشت؛ ارائه‌دهنده‌های بازار در دسترس نبودند.'
                  : 'روی هر ردیف بزنید تا دلایل تحلیل نمایش داده شود.')
    : 'هنوز اجرایی ثبت نشده است.';

  const rows=results.slice().sort((a,b)=>Number(b.signal?.score||0)-Number(a.signal?.score||0));
  document.getElementById('scan').innerHTML = rows.length ? '<table><tr><th>نماد</th><th>ارائه‌دهنده</th><th>قیمت</th><th>امتیاز</th><th>سیگنال</th><th>عملیات</th><th>RSI</th><th>روند</th><th>حجم</th><th>خرید حقیقی</th></tr>'+
    rows.map((r,i)=>{
      const sig=r.signal||{}, sc=Number(sig.score||0), act=(actions.find(a=>a.symbol===r.symbol)||{}).action||'—';
      const dead=Number(r.price)<=0;
      return '<tr class="row'+(dead?' dead':'')+'" data-i="'+i+'" title="'+esc(r.error||'')+'">'+
        '<td><b>'+esc(r.symbol)+'</b></td>'+
        '<td class="muted">'+esc(r.provider)+'</td>'+
        '<td>'+(dead?'—':money(r.price))+'</td>'+
        '<td>'+num(sig.score)+'<span class="bar"><i style="width:'+Math.max(0,Math.min(100,sc))+'%"></i></span></td>'+
        '<td>'+actionPill(sig.action)+'</td>'+
        '<td>'+esc(act)+'</td>'+
        '<td>'+num(sig.rsi)+'</td>'+
        '<td>'+esc(sig.trend||'—')+'</td>'+
        '<td>'+(sig.volume_ratio==null?'—':num(sig.volume_ratio)+'x')+'</td>'+
        '<td>'+(r.flow&&r.flow.real_buy_ratio!=null?pct(Number(r.flow.real_buy_ratio)*100):'—')+'</td></tr>';
    }).join('')+'</table>' : '<div class="muted">داده‌ای برای نمایش نیست.</div>';

  document.getElementById('scan').onclick=e=>{
    const tr=e.target.closest('tr.row'); if(!tr) return;
    const r=rows[Number(tr.dataset.i)]||{}, sig=r.signal||{}, box=document.getElementById('detail');
    const reasons=(sig.reasons||[]).filter(x=>String(x)!==String(r.error|| ''))
      .map(x=>'<li>'+esc(x)+'</li>').join('');
    const pos=(paper.positions||{})[r.symbol];
    box.innerHTML='<h3>🔎 '+esc(r.symbol)+' — امتیاز '+num(sig.score)+'/100</h3>'+
      '<div class="muted">ارائه‌دهنده: '+esc(r.provider)+' | نقاط تاریخی: '+num(r.history_points)+
      ' | گزارش‌های کدال: '+num(r.codal_filings)+' | موقعیت: '+(pos?esc(pos.quantity)+' سهم':'بدون موقعیت')+'</div>'+
      (r.error?'<div class="down" style="margin-top:8px">خطا: '+esc(r.error)+'</div>':'')+
      '<ul>'+(reasons||'<li>دلیلی ثبت نشده است.</li>')+'</ul>';
    box.style.display='block';
    if(box.scrollIntoView) box.scrollIntoView({behavior:'smooth',block:'nearest'});
  };

  document.getElementById('positions').innerHTML=positionTable(paper);
  document.getElementById('actions').innerHTML=actionTable(actions);

  const unavailable='داده بازار (TSETMC) در این اجرا در دسترس نبود.';
  const g=d.top_gainers||[], v=d.top_volume||[];
  const emptyAll=!g.length&&!v.length;
  document.getElementById('gainers').innerHTML=marketTable(g, emptyAll?unavailable:'برای این بخش داده‌ای برنگشت.');
  document.getElementById('volume').innerHTML=marketTable(v, emptyAll?unavailable:'برای این بخش داده‌ای برنگشت.');
}

fetch('data.json?x='+Date.now()).then(r=>r.json()).then(render)
 .catch(e=>{document.getElementById('updated').textContent='داده داشبورد در دسترس نیست: '+e;});
</script></body></html>
