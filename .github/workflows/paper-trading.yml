name: Iran Stock Paper Trading
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
jobs:
  paper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run paper trading and dashboard
        run: python -m src.main
      - name: Commit paper state
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "IranStock Demo Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper-account.json dashboard/data.json
          git diff --cached --quiet || git commit -m "Update paper trading state"
          git push
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: iran-stock-dashboard
          path: dashboard/
          retention-days: 7
